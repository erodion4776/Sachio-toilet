name: Create Sachio Release Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Create release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore my-upload-key.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Sachio, OU=Xtop Retail Technologies, O=Xtop Retail Technologies, L=Benin City, ST=Edo, C=NG"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: sachio-release-keystore
          path: my-upload-key.jks
