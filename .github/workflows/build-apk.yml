name: Build Debug APK

# Builds automatically on every push to main, and can also be run manually
# from the Actions tab (the "Run workflow" button).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Recreates .env from repo secrets, since .env is git-ignored and never
      # committed. Add these under: Settings -> Secrets and variables ->
      # Actions -> New repository secret, using the exact names below.
      # Falls back to a placeholder for any secret left empty/unset (e.g.
      # MAPS_API_KEY before you have a real one) - an empty value here would
      # otherwise generate invalid Java in BuildConfig and break the build.
      - name: Write .env from GitHub Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat > .env <<EOF
          GEMINI_API_KEY=${GEMINI_API_KEY:-unused}
          SUPABASE_URL=${SUPABASE_URL:-MISSING_SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-MISSING_SUPABASE_ANON_KEY}
          PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY:-MISSING_PAYSTACK_PUBLIC_KEY}
          MAPS_API_KEY=${MAPS_API_KEY:-placeholder_maps_key}
          EOF

      # Generates the standard Android debug keystore. This is NOT a secret -
      # every Android Studio install auto-generates this exact same file with
      # these exact same well-known credentials (android/android/androiddebugkey).
      # It's git-ignored on purpose (all keystores are, as good practice), so
      # CI needs to recreate it fresh on every run.
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 10950 -keyalg RSA -keysize 2048

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
